<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b51d30"><title>Покупки в Магните</title><link rel="stylesheet" href="./style.css"><script type="module" src="./app.js?v=one-tap"></script></head><body>
<header><div class="head"><h1>Покупки</h1><div class="head-actions"><span id="sync-status" role="status">Загружаю…</span><button id="app-menu" class="icon" aria-label="Меню списка" aria-haspopup="dialog">⋯</button></div></div><div class="tabs" role="tablist" aria-label="Списки"><button id="current-tab" role="tab" aria-selected="true" aria-controls="panel">Купить сейчас</button><button id="archive-tab" role="tab" aria-selected="false" aria-controls="panel" tabindex="-1">На будущее</button></div></header>
<main id="panel" role="tabpanel" aria-labelledby="current-tab"><div id="login" class="banner" hidden><p id="login-text"></p><button id="retry-sync">Повторить</button></div><div class="list-bar" id="list-bar"><strong id="remaining"></strong><label class="switch"><input id="hide-bought" type="checkbox">Скрыть взятое</label></div><div id="complete" class="complete" hidden>Всё необходимое взято.</div><div id="list"></div><div id="empty" class="empty" hidden></div></main>
<div class="bottom"><button id="add" class="primary">+ Товар</button></div><div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<dialog id="edit-dialog" aria-labelledby="edit-title"><form id="edit-form"><div class="sheet-head"><h2 id="edit-title">Новый товар</h2><button type="button" class="icon" id="close-edit" aria-label="Закрыть">×</button></div><label>Название<input id="item-name" type="text" required maxlength="160" placeholder="Например, гречка"></label><div class="fields"><label>Количество<input id="item-quantity" type="text" maxlength="100" placeholder="2 упаковки"></label><label>Отдел<select id="item-section"></select></label></div><details class="extra"><summary>Примечание и пожелания</summary><label>Примечание<textarea id="item-note" maxlength="600" placeholder="Марка, цена, цвет упаковки"></textarea></label><label class="switch"><input id="item-optional" type="checkbox">Необязательно покупать</label></details><p id="form-error" class="error" role="alert" hidden></p><button class="primary submit" type="submit">Добавить</button></form></dialog>
<dialog id="settings-dialog" aria-labelledby="settings-title"><div class="sheet-head"><h2 id="settings-title">Список покупок</h2><button class="icon" id="close-settings" aria-label="Закрыть">×</button></div><button class="action" id="share-link">Скопировать ссылку для семьи</button><button class="action" id="reset-checks">Снять отметки с покупок</button><p class="help">Изменения сохраняются в общем списке. Без связи — на устройстве до подключения.</p></dialog>
<dialog id="share-dialog" aria-labelledby="share-title"><div class="sheet-head"><h2 id="share-title">Ссылка для семьи</h2><button class="icon" id="close-share" aria-label="Закрыть">×</button></div><p class="help">По этой ссылке открывается общий список без аккаунта.</p><input id="share-url" type="text" readonly aria-label="Секретная ссылка"></dialog></body></html>
