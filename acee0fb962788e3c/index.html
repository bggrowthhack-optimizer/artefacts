<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b51d30"><title>Покупки в Магните</title><style>
:root{color-scheme:light;--red:#b51d30;--ink:#202124;--muted:#62666d;--line:#e4e5e8}*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}header{background:#fff;position:sticky;top:0;z-index:3;border-bottom:1px solid var(--line)}.inner,main{max-width:760px;margin:auto;padding:18px 20px}h1{font-size:26px;line-height:1.2;margin:0 0 5px}p{margin:4px 0;color:var(--muted)}.kicker{color:var(--red);font-size:14px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;margin-bottom:8px}.status{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:17px;font-weight:650}.track{height:6px;background:#eceef1;border-radius:9px;margin:10px 0 16px;overflow:hidden}.bar{height:100%;background:var(--red);transition:width .2s}button{font:inherit;cursor:pointer;min-height:44px;border:1px solid var(--line);background:white;border-radius:12px;padding:8px 15px;color:var(--ink)}button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #9d75ff;outline-offset:3px}button[aria-pressed=true]{background:var(--ink);color:white;border-color:var(--ink)}.toolbar{display:flex;flex-wrap:wrap;gap:8px}.toolbar .reset{margin-left:auto;color:var(--muted)}nav{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 22px}nav a{color:var(--muted);text-decoration:none;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}details{background:#fff;border:1px solid var(--line);border-radius:16px;margin:0 0 16px;scroll-margin-top:240px;overflow:hidden}summary{cursor:pointer;min-height:66px;padding:18px 16px;font-weight:650;display:flex;align-items:center;justify-content:space-between;gap:12px;list-style:none}summary::-webkit-details-marker{display:none}summary:after{content:'−';font-weight:400;color:var(--muted)}details:not([open]) summary:after{content:'+'}.section-count{margin-left:auto;font-size:14px;white-space:nowrap;color:var(--muted);font-weight:400}.note{padding:0 16px 12px;font-size:14px;color:var(--red)}.item{display:flex;align-items:flex-start;gap:14px;padding:16px;min-height:62px;border-top:1px solid #f0f1f3;cursor:pointer}.item input{width:25px;height:25px;flex-shrink:0;margin:0;accent-color:var(--red)}.item .text{min-width:0;overflow-wrap:anywhere}.item.done .text{text-decoration:line-through;color:#777d83}.item.done{background:#fafafa}.badge{display:block;color:var(--muted);font-size:14px;text-decoration:none}.item.hidden{display:none}.empty{padding:8px 16px 18px;color:var(--muted);font-size:14px}.complete{background:#eef7ee;border-radius:12px;padding:16px;margin-bottom:16px}.save-note{font-size:14px;margin:20px 0 30px}footer{padding:5px 0 30px;font-size:14px;color:var(--muted)}@media(max-width:420px){.inner,main{padding:15px 14px}h1{font-size:24px}.toolbar .reset{margin-left:0}summary{padding:16px 13px}.item{padding:16px 13px}.status{font-size:15px}}

/* Mobile shopping layout */
html{scroll-padding-top:var(--shopping-header-height,190px)}
button,a,label,summary{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,input{font-size:16px}
summary>span:first-child{min-width:0;overflow-wrap:anywhere}
.item input{position:relative;top:2px}
#reset{margin:14px 0 0;min-height:48px}
@media(max-width:600px){
 .inner{padding:12px 14px 10px;padding-top:max(12px,env(safe-area-inset-top))}
 main{padding:14px 10px max(24px,env(safe-area-inset-bottom))}
 .kicker{display:none}
 h1{font-size:21px;margin:0}
 .status{margin-top:8px;font-size:15px;gap:8px}
 .track{margin:7px 0 10px;height:5px}
 .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
 .toolbar button{min-width:0;min-height:46px;padding:9px 6px;font-size:15px}
 nav{flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding:0 4px 9px;margin:0 0 9px;scrollbar-width:thin}
 nav a{display:flex;align-items:center;justify-content:center;flex-shrink:0;min-height:44px;white-space:nowrap}
 details{border-radius:13px;margin-bottom:12px;scroll-margin-top:var(--shopping-header-height,190px)}
 summary{padding:15px 13px;min-height:62px;gap:9px;font-size:16px}
 .section-count{font-size:14px}
 .item{min-height:72px;padding:17px 14px;gap:13px;align-items:flex-start}
 .item input{width:28px;height:28px}
 .item .text{font-size:17px;line-height:1.5;flex:1}
 .note{font-size:15px;padding:0 14px 13px}
 .badge,.save-note,footer{font-size:14px}
 footer{padding-bottom:25px}
}
@media(prefers-reduced-motion:reduce){.bar{transition:none}}
</style></head><body><header><div class="inner"><div class="kicker">Магнит · гипермаркет</div><h1>Список покупок</h1><div class="status" aria-live="polite"><span id="counter"></span><span id="remaining"></span></div><div class="track" role="progressbar" aria-label="Прогресс покупок" aria-valuemin="0" aria-valuemax="32" aria-valuenow="0"><div class="bar"></div></div><div class="toolbar"><button id="all" aria-pressed="true">Все товары</button><button id="left" aria-pressed="false">Только осталось</button></div></div></header><main><nav id="departments" aria-label="Отделы магазина"></nav><div id="complete" class="complete" hidden>Всё необходимое взято. Можно идти на кассу.</div><div id="list"></div><p id="storage" class="save-note">Отметки сохраняются в этом браузере на этом устройстве.</p><button class="reset" id="reset">Снять отметки</button><footer>Для рыбы и креветок достаточно одного варианта. Nemoloko — по желанию.</footer></main><script>const groups=[{"name": "Овощи, фрукты и зелень", "items": [{"id": "item-0", "text": "Бананы — 6 шт., свежие, плотные, без пятен.", "optional": false, "alternative": false}, {"id": "item-1", "text": "Яблоки нового урожая — 2 кг.", "optional": false, "alternative": false}, {"id": "item-2", "text": "Груши Вильямс/Пакхамс — около 0,6 кг.", "optional": false, "alternative": false}, {"id": "item-3", "text": "Мандарины — около 1 кг (на скриншоте 1,06 кг).", "optional": false, "alternative": false}, {"id": "item-4", "text": "Авокадо «Хаас» — 2 шт., коричневые, чуть мягкие.", "optional": false, "alternative": false}, {"id": "item-5", "text": "Огурцы — 2 кг, только плотные и пупырчатые.", "optional": false, "alternative": false}, {"id": "item-6", "text": "Помидоры — 1 кг", "optional": false, "alternative": false}, {"id": "item-7", "text": "Черри — 1 упаковка, только до 120 ₽.", "optional": false, "alternative": false}, {"id": "item-8", "text": "Перец болгарский красный — 4 шт., свежий.", "optional": false, "alternative": false}, {"id": "item-9", "text": "Кабачок — нормальный, без пятен; количество не указано.", "optional": false, "alternative": false}, {"id": "item-10", "text": "Картошка — 2 кг.", "optional": false, "alternative": false}, {"id": "item-11", "text": "Листовой салат — 1 упаковка или горшочек, свежий.", "optional": false, "alternative": false}, {"id": "item-12", "text": "Укроп — количество не указано.", "optional": false, "alternative": false}]}, {"name": "Хлеб и хлебцы", "items": [{"id": "item-13", "text": "Лаваш севанский тонкий — 1 шт.", "optional": false, "alternative": false}, {"id": "item-14", "text": "Хлебцы из бурого риса, квадратные — упаковка; число упаковок не указано.", "optional": false, "alternative": false}, {"id": "item-15", "text": "Хлебцы «Круазетт» тонкие с прованскими травами, 200 г — 1 уп.", "optional": false, "alternative": false}, {"id": "item-16", "text": "Хлебцы «Здоровый Хлеб» протеиновые чечевичные с белыми грибами, 400 г — 1 уп.", "optional": false, "alternative": false}]}, {"name": "Молочные продукты и сыры", "items": [{"id": "item-17", "text": "Молоко «Очень важная корова» 3,2% — 1 шт., красная упаковка.", "optional": false, "alternative": false}, {"id": "item-18", "text": "Сметана «Важная корова» 15% — 2 шт., красная упаковка.", "optional": false, "alternative": false}, {"id": "item-19", "text": "Йогурт «Актибио» — 4 шт.", "optional": false, "alternative": false}, {"id": "item-20", "text": "Творог 9% — большой, в синей упаковке, в брикетах; количество не указано.", "optional": false, "alternative": false}, {"id": "item-21", "text": "Творог «Савушкин» рассыпчатый 5%, 700 г — 1 шт.", "optional": false, "alternative": false}, {"id": "item-22", "text": "Творог мягкий «Простоквашино» 5%, 120 г — 2 шт.", "optional": false, "alternative": false}, {"id": "item-23", "text": "Сыр лёгкий — 1 треугольник", "optional": false, "alternative": false}, {"id": "item-24", "text": "Рикотта «Ондрмандер» — 1 шт.", "optional": false, "alternative": false}, {"id": "item-25", "text": "Сыр «Беловежские сыры» «Белая фета» 40%, 250 г — 1 шт.", "optional": false, "alternative": false}]}, {"name": "Рыба и замороженные морепродукты", "items": [{"id": "item-26", "text": "Рыба солёная — 200 г, плотный кусок, до 400 ₽", "optional": false, "alternative": true}, {"id": "item-27", "text": "Либо креветки чищенные, с неочищенными хвостами — примерно до 600 ₽", "optional": false, "alternative": true}]}, {"name": "Кофе, сладости и полезные перекусы", "items": [{"id": "item-28", "text": "Кофе молотый Egoiste Espresso, 250 г — 1 шт.", "optional": false, "alternative": false}, {"id": "item-29", "text": "Пастила белёвская без сахара «Зожно Несложно», 100 г — 4 шт.", "optional": false, "alternative": false}, {"id": "item-30", "text": "Протеиновое пирожное Fitnesshock «Брауни горячий шоколад», 50 г — 1 шт.", "optional": false, "alternative": false}]}, {"name": "Вода и растительные напитки", "items": [{"id": "item-31", "text": "Минеральная вода «Нарзан», 1,5 л — 5 шт.", "optional": false, "alternative": false}, {"id": "item-32", "text": "Детская вода — 3 шт.", "optional": false, "alternative": false}, {"id": "item-33", "text": "Овсяный напиток Nemoloko классический 3,2%, 1 л — 1 шт., необязательно.", "optional": true, "alternative": false}]}];</script><script>
const KEY='ruslan-magnit-shopping-2026-11-22-v1';let state={checked:[],mode:'all'},canSave=true;try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.checked))state={checked:saved.checked,mode:saved.mode==='left'?'left':'all'}}catch(e){canSave=false}const checked=new Set(state.checked),allItems=groups.flatMap(g=>g.items),alt=allItems.filter(i=>i.alternative);if(alt.filter(i=>checked.has(i.id)).length>1)checked.delete(alt[1].id);let mode=state.mode;const list=document.getElementById('list');
function save(){try{localStorage.setItem(KEY,JSON.stringify({checked:[...checked],mode}));canSave=true}catch(e){canSave=false}document.getElementById('storage').textContent=canSave?'Отметки сохраняются в этом браузере на этом устройстве.':'Браузер не разрешает сохранять отметки. Не закрывай эту страницу до конца покупок.'}
function planned(items){return items.filter(i=>!i.optional&&!i.alternative).length+(items.some(i=>i.alternative)?1:0)}function done(items){return items.filter(i=>!i.optional&&!i.alternative&&checked.has(i.id)).length+(items.some(i=>i.alternative&&checked.has(i.id))?1:0)}
groups.forEach((g,n)=>{const a=document.createElement('a');a.href='#dept-'+n;a.textContent=['Овощи и фрукты','Хлебцы','Молочное','Рыба','Кофе и сладости','Вода'][n];document.getElementById('departments').append(a);a.addEventListener('click',()=>document.getElementById('dept-'+n).open=true);const d=document.createElement('details');d.id='dept-'+n;d.open=true;const s=document.createElement('summary');const title=document.createElement('span');title.textContent=g.name;const count=document.createElement('span');count.className='section-count';s.append(title,count);d.append(s);if(n===3){const p=document.createElement('div');p.className='note';p.textContent='Один вариант: рыба до 400 ₽ или креветки примерно до 600 ₽.';d.append(p)}g.items.forEach(item=>{const label=document.createElement('label');label.className='item';label.dataset.id=item.id;const input=document.createElement('input');input.type='checkbox';input.checked=checked.has(item.id);const text=document.createElement('span');text.className='text';text.textContent=item.text;if(item.optional){const badge=document.createElement('span');badge.className='badge';badge.textContent='По желанию · не влияет на завершение';text.append(badge)}label.append(input,text);d.append(label);input.addEventListener('change',()=>{if(input.checked){if(item.alternative)alt.forEach(i=>checked.delete(i.id));checked.add(item.id)}else checked.delete(item.id);save();update()})});const empty=document.createElement('div');empty.className='empty';empty.hidden=true;d.append(empty);list.append(d)});
function update(){const total=planned(allItems),taken=done(allItems);document.getElementById('counter').textContent='Взято '+taken+' из '+total;document.getElementById('remaining').textContent='Осталось '+(total-taken);document.querySelector('.bar').style.width=(taken/total*100)+'%';document.querySelector('.track').setAttribute('aria-valuenow',taken);document.getElementById('complete').hidden=taken!==total;document.getElementById('all').setAttribute('aria-pressed',mode==='all');document.getElementById('left').setAttribute('aria-pressed',mode==='left');groups.forEach((g,n)=>{const d=document.getElementById('dept-'+n);d.querySelector('.section-count').textContent=done(g.items)+' / '+planned(g.items);let visible=0;g.items.forEach(item=>{const row=d.querySelector('[data-id="'+item.id+'"]'),isDone=checked.has(item.id),otherChosen=item.alternative&&alt.some(i=>i.id!==item.id&&checked.has(i.id));row.querySelector('input').checked=isDone;row.classList.toggle('done',isDone);const hidden=mode==='left'&&(isDone||otherChosen);row.classList.toggle('hidden',hidden);if(!hidden)visible++});const empty=d.querySelector('.empty');empty.hidden=visible!==0;empty.textContent='В этом отделе всё взято.'})}
document.getElementById('all').onclick=()=>{mode='all';save();update()};document.getElementById('left').onclick=()=>{mode='left';save();update()};document.getElementById('reset').onclick=()=>{if(checked.size&&confirm('Снять все отметки и начать список заново?')){checked.clear();save();update()}};save();update();
const headerObserver=new ResizeObserver(entries=>{document.documentElement.style.setProperty("--shopping-header-height",(Math.ceil(entries[0].target.getBoundingClientRect().height)+12)+"px")});headerObserver.observe(document.querySelector("header"));
</script></body></html>
