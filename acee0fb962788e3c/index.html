<script>const groups=[{"name": "Овощи, фрукты и зелень", "items": [{"id": "item-0", "text": "Бананы — 6 шт., свежие, плотные, без пятен.", "optional": false, "alternative": false}, {"id": "item-1", "text": "Яблоки нового урожая — 2 кг.", "optional": false, "alternative": false}, {"id": "item-2", "text": "Груши Вильямс/Пакхамс — около 0,6 кг.", "optional": false, "alternative": false}, {"id": "item-3", "text": "Мандарины — около 1 кг (на скриншоте 1,06 кг).", "optional": false, "alternative": false}, {"id": "item-4", "text": "Авокадо «Хаас» — 2 шт., коричневые, чуть мягкие.", "optional": false, "alternative": false}, {"id": "item-5", "text": "Огурцы — 2 кг, только плотные и пупырчатые.", "optional": false, "alternative": false}, {"id": "item-6", "text": "Помидоры — 1 кг", "optional": false, "alternative": false}, {"id": "item-7", "text": "Черри — 1 упаковка, только до 120 ₽.", "optional": false, "alternative": false}, {"id": "item-8", "text": "Перец болгарский красный — 4 шт., свежий.", "optional": false, "alternative": false}, {"id": "item-9", "text": "Кабачок — нормальный, без пятен; количество не указано.", "optional": false, "alternative": false}, {"id": "item-10", "text": "Картошка — 2 кг.", "optional": false, "alternative": false}, {"id": "item-11", "text": "Листовой салат — 1 упаковка или горшочек, свежий.", "optional": false, "alternative": false}, {"id": "item-12", "text": "Укроп — количество не указано.", "optional": false, "alternative": false}]}, {"name": "Хлеб и хлебцы", "items": [{"id": "item-13", "text": "Лаваш севанский тонкий — 1 шт.", "optional": false, "alternative": false}, {"id": "item-14", "text": "Хлебцы из бурого риса, квадратные — упаковка; число упаковок не указано.", "optional": false, "alternative": false}, {"id": "item-15", "text": "Хлебцы «Круазетт» тонкие с прованскими травами, 200 г — 1 уп.", "optional": false, "alternative": false}, {"id": "item-16", "text": "Хлебцы «Здоровый Хлеб» протеиновые чечевичные с белыми грибами, 400 г — 1 уп.", "optional": false, "alternative": false}]}, {"name": "Молочные продукты и сыры", "items": [{"id": "item-17", "text": "Молоко «Очень важная корова» 3,2% — 1 шт., красная упаковка.", "optional": false, "alternative": false}, {"id": "item-18", "text": "Сметана «Важная корова» 15% — 2 шт., красная упаковка.", "optional": false, "alternative": false}, {"id": "item-19", "text": "Йогурт «Актибио» — 4 шт.", "optional": false, "alternative": false}, {"id": "item-20", "text": "Творог 9% — большой, в синей упаковке, в брикетах; количество не указано.", "optional": false, "alternative": false}, {"id": "item-21", "text": "Творог «Савушкин» рассыпчатый 5%, 700 г — 1 шт.", "optional": false, "alternative": false}, {"id": "item-22", "text": "Творог мягкий «Простоквашино» 5%, 120 г — 2 шт.", "optional": false, "alternative": false}, {"id": "item-23", "text": "Сыр лёгкий — 1 треугольник", "optional": false, "alternative": false}, {"id": "item-24", "text": "Рикотта «Ондрмандер» — 1 шт.", "optional": false, "alternative": false}, {"id": "item-25", "text": "Сыр «Беловежские сыры» «Белая фета» 40%, 250 г — 1 шт.", "optional": false, "alternative": false}]}, {"name": "Рыба и замороженные морепродукты", "items": [{"id": "item-26", "text": "Рыба солёная — 200 г, плотный кусок, до 400 ₽", "optional": false, "alternative": true}, {"id": "item-27", "text": "Либо креветки чищенные, с неочищенными хвостами — примерно до 600 ₽", "optional": false, "alternative": true}]}, {"name": "Кофе, сладости и полезные перекусы", "items": [{"id": "item-28", "text": "Кофе молотый Egoiste Espresso, 250 г — 1 шт.", "optional": false, "alternative": false}, {"id": "item-29", "text": "Пастила белёвская без сахара «Зожно Несложно», 100 г — 4 шт.", "optional": false, "alternative": false}, {"id": "item-30", "text": "Протеиновое пирожное Fitnesshock «Брауни горячий шоколад», 50 г — 1 шт.", "optional": false, "alternative": false}]}, {"name": "Вода и растительные напитки", "items": [{"id": "item-31", "text": "Мине <script>
function createShoppingModel(seed, storage, key) {
  const base = seed.flatMap((group, section) => group.items.map(item => ({...item, section})));
  let loaded = {}, storageProblem = false;
  try { const raw = storage.getItem(key); if (raw) { loaded = JSON.parse(raw); if (!loaded || typeof loaded !== 'object') loaded = {}; } } catch { storageProblem = true; }
  const knownIds = new Set(base.map(item => item.id));
  const customItems = [];
  if (Array.isArray(loaded.customItems)) for (const item of loaded.customItems) {
    if (!item || typeof item.id !== 'string' || knownIds.has(item.id) || typeof item.text !== 'string' || !item.text.trim() || !Number.isInteger(item.section) || item.section < 0 || item.section >= seed.length) continue;
    customItems.push({id:item.id, text:item.text, section:item.section, optional:item.optional === true, alternative:false}); knownIds.add(item.id);
  }
  const archived = new Set(Array.isArray(loaded.archived) ? loaded.archived.filter(id => knownIds.has(id)) : []);
  const checked = new Set(Array.isArray(loaded.checked) ? loaded.checked.filter(id => knownIds.has(id) && !archived.has(id)) : []);
  let mode = loaded.mode === 'left' ? 'left' : 'all';
  const all = () => [...base, ...customItems];
  const active = () => all().filter(item => !archived.has(item.id));
  function cleanAlternatives() { let chosen = false; for (const item of active()) if (item.alternative && checked.has(item.id)) { if (chosen) checked.delete(item.id); chosen = true; } }
  cleanAlternatives();
  function save() { try { storage.setItem(key, JSON.stringify({version:2, checked:[...checked], archived:[...archived], customItems, mode})); storageProblem = false; } catch { storageProblem = true; } }
  function get(id) { return all().find(item => item.id === id); }
  function toggle(id, value) { const item = get(id); if (!item || archived.has(id)) return; if (value) { if (item.alternative) all().filter(i => i.alternative).forEach(i => checked.delete(i.id)); checked.add(id); } else checked.delete(id); save(); }
  function archive(id) { if (!get(id)) return; archived.add(id); checked.delete(id); save(); }
  function restore(id) { if (!get(id)) return; archived.delete(id); checked.delete(id); save(); }
  function add({name, amount='', note='', section, optional=false, toArchive=false}) {
    name = String(name).trim(); amount = String(amount).trim(); note = String(note).trim();
    if (!name || name.length > 160 || amount.length > 80 || note.length > 300 || !Number.isInteger(section) || section < 0 || section >= seed.length) throw new Error('Проверь название и отдел товара.');
    let id; do { id = 'custom-' + (typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)); } while (get(id));
    const text = name + (amount ? ' — ' + amount : '') + (note ? '; ' + note : '');
    const item = {id, text, section, optional:!!optional, alternative:false}; customItems.push(item); if (toArchive) archived.add(id); save(); return item;
  }
  function counts(items=active()) { const required = items.filter(item => !item.optional && !item.alternative); return {total:required.length + (items.some(item => item.alternative) ? 1 : 0), done:required.filter(item => checked.has(item.id)).length + (items.some(item => item.alternative && checked.has(item.id)) ? 1 : 0)}; }
  function isVisible(item) { return mode !== 'left' || (!checked.has(item.id) && !(item.alternative && active().some(other => other.alternative && checked.has(other.id)))); }
  function reset() { for (const item of active()) checked.delete(item.id); save(); }
  return {all, active, get, toggle, archive, restore, add, counts, isVisible, reset, isArchived:id=>archived.has(id), isChecked:id=>checked.has(id), get mode(){return mode}, setMode(value){mode=value==='left'?'left':'all';save()}, get storageProblem(){return storageProblem}};
}

const KEY = 'ruslan-magnit-shopping-2026-11-22-v1';
const model = createShoppingModel(groups, {getItem:key=>localStorage.getItem(key), setItem:(key,value)=>localStorage.setItem(key,value)}, KEY);
let view = 'current', noticeTimer;
const opened = {current:new Set(), archive:new Set()};
const $ = id => document.getElementById(id);
const list = $('list');
const shortNames = ['Овощи и фрукты', 'Хлебцы', 'Молочное', 'Рыба', 'Кофе и сладости', 'Вода'];
function storageNote() { $('storage').textContent = model.storageProblem ? 'Не удалось сохранить изменения. Не закрывай страницу до конца покупок.' : 'Товары, архив и отметки сохраняются в этом браузере на этом устройстве.'; }
function notify(text) { clearTimeout(noticeTimer); $('notice').textContent=text; $('notice').hidden=false; noticeTimer=setTimeout(()=>$('notice').hidden=true,3200); }
function viewItems() { return model.all().filter(item => model.isArchived(item.id) === (view === 'archive')); }
function update() {
  const {total,done} = model.counts();
  $('counter').textContent='Взято '+done+' из '+total;
  $('remaining').textContent='Осталось '+(total-done);
  document.querySelector('.bar').style.width=(total ? done/total*100 : 0)+'%';
  const progress=document.querySelector('.track');progress.setAttribute('aria-valuemax',total);progress.setAttribute('aria-valuenow',done);
  $('complete').hidden=view!=='current'||!total||done!==total;
  $('all').setAttribute('aria-pressed',model.mode==='all');$('left').setAttribute('aria-pressed',model.mode==='left');
  $('current-header').hidden=view!=='current';$('archive-intro').hidden=view!=='archive';$('reset').hidden=view!=='current';
  const archiveCount=model.all().filter(i=>model.isArchived(i.id)).length;
  $('archive-tab').textContent=archiveCount ? 'На будущее · '+archiveCount : 'На будущее';
  ['current','archive'].forEach(v=>{const tab=$(v+'-tab');tab.setAttribute('aria-selected',view===v);tab.tabIndex=view===v?0:-1;});
  $('shopping-panel').setAttribute('aria-labelledby',view+'-tab');
  const visibleItems=viewItems();
  $('empty-list').hidden=visibleItems.length!==0;
  $('empty-list').textContent=view==='archive'?'Пока здесь пусто. Переноси сюда товары, которые сейчас не нужны.':'В текущем списке нет товаров. Добавь новый или верни товар из раздела «На будущее».';
  groups.forEach((g,n)=>{
    const details=$('dept-'+n);if(!details)return;
    const items=visibleItems.filter(item=>item.section===n), count=details.querySelector('.section-count');
    const counts=model.counts(items);count.textContent=view==='archive'?String(items.length):(counts.total ? counts.done+' / '+counts.total : 'По желанию');
    let visible=0;
    items.forEach(item=>{const row=details.querySelector('[data-id="'+item.id+'"]');if(!row)return;const input=row.querySelector('input');if(input)input.checked=model.isChecked(item.id);row.classList.toggle('done',view==='current'&&model.isChecked(item.id));const hidden=view==='current'&&!model.isVisible(item);row.hidden=hidden;if(!hidden)visible++;});
    const empty=details.querySelector('.empty');empty.hidden=visible!==0;empty.textContent='В этом отделе всё взято.';
  });storageNote();
}
function render() {
  list.replaceChildren();$('departments').replaceChildren();
  const items=viewItems();
  groups.forEach((group,n)=>{
    const sectionItems=items.filter(item=>item.section===n);if(!sectionItems.length)return;
    const details=document.createElement('details');details.id='dept-'+n;details.open=opened[view].has(n);
    const thisView=view;
    details.addEventListener('toggle',()=>{if(!details.isConnected)return;if(details.open)opened[thisView].add(n);else opened[thisView].delete(n);});
    const summary=document.createElement('summary'),title=document.createElement('span'),count=document.createElement('span');title.textContent=group.name;count.className='section-count';summary.append(title,count);details.append(summary);
    const nav=document.createElement('a');nav.href='#dept-'+n;nav.textContent=shortNames[n];nav.addEventListener('click',()=>{details.open=true;opened[view].add(n);});$('departments').append(nav);
    if(view==='current'&&sectionItems.some(item=>item.alternative)) {const note=document.createElement('div');note.className='note';note.textContent='Один вариант: рыба до 400 ₽ или креветки примерно до 600 ₽.';details.append(note);}
    sectionItems.forEach(item=>{
      const row=document.createElement('div');row.className='row';row.dataset.id=item.id;
      const label=document.createElement(view==='current'?'label':'div');label.className='item'+(view==='archive'?' archive-text':'');
      if(view==='current') {const input=document.createElement('input');input.type='checkbox';input.checked=model.isChecked(item.id);label.append(input);input.addEventListener('change',()=>{model.toggle(item.id,input.checked);update();if(row.hidden)summary.focus({preventScroll:true});});}
      const text=document.createElement('span');text.className='text';text.textContent=item.text;
      if(item.optional){const badge=document.createElement('span');badge.className='badge';badge.textContent='По желанию';text.append(badge);}
      label.append(text);row.append(label);
      const actions=document.createElement('div');actions.className='row-actions';const action=document.createElement('button');action.type='button';action.textContent=view==='archive'?'Вернуть в покупки':'В архив';if(view==='archive')action.className='restore';action.setAttribute('aria-label',action.textContent+': '+item.text);
      action.addEventListener('click',()=>{document.querySelectorAll('#list details').forEach(d=>{const idx=Number(d.id.slice(5));if(d.open)opened[view].add(idx);else opened[view].delete(idx);});const wasArchive=view==='archive';if(wasArchive)model.restore(item.id);else model.archive(item.id);render();const anchor=$('dept-'+n)?.querySelector('summary');(anchor||$(view+'-tab')).focus({preventScroll:true});notify(wasArchive?'Товар возвращён в покупки':'Товар перенесён на будущее');});
      actions.append(action);row.append(actions);details.append(row);
    });
    const empty=document.createElement('div');empty.className='empty';empty.hidden=true;details.append(empty);list.append(details);
  });update();
}
function switchView(value) {
  if(view===value)return;
  document.querySelectorAll('#list details').forEach(d=>{const n=Number(d.id.slice(5));if(d.open)opened[view].add(n);else opened[view].delete(n);});
  view=value;closeForm();render();
}
$('current-tab').onclick=()=>switchView('current');$('archive-tab').onclick=()=>switchView('archive');
document.querySelector('.tabs').addEventListener('keydown',event=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const next=event.key==='Home'?'current':event.key==='End'?'archive':view==='current'?'archive':'current';switchView(next);$(next+'-tab').focus();}});
$('all').onclick=()=>{model.setMode('all');update();};$('left').onclick=()=>{model.setMode('left');update();};
$('reset').onclick=()=>{if(model.active().some(i=>model.isChecked(i.id))&&confirm('Снять отметки с текущих покупок? Архив и добавленные товары сохранятся.')){model.reset();update();}};
groups.forEach((group,n)=>{const option=document.createElement('option');option.value=n;option.textContent=group.name;$('new-section').append(option);});
function closeForm(){$('add-form').hidden=true;$('open-add').setAttribute('aria-expanded','false');$('form-error').hidden=true;}
$('open-add').onclick=()=>{const shouldOpen=$('add-form').hidden;if(!shouldOpen){closeForm();return;}$('add-form').hidden=false;$('open-add').setAttribute('aria-expanded','true');$('new-destination').value=view;$('new-name').focus();};
$('cancel-add').onclick=()=>{closeForm();$('open-add').focus();};
$('add-form').addEventListener('submit',event=>{
  event.preventDefault();if(!$('new-name').value.trim()){const error=$('form-error');error.textContent='Введи название товара.';error.hidden=false;$('new-name').focus();return;}
  try {
    const target=$('new-destination').value,section=Number($('new-section').value);
    const item=model.add({name:$('new-name').value,amount:$('new-amount').value,note:$('new-note').value,section,optional:$('new-optional').checked,toArchive:target==='archive'});
    $('add-form').reset();closeForm();
    if(target!==view)switchView(target);
    opened[view].add(section);render();
    $('dept-'+section)?.scrollIntoView({block:'start'});
    $('dept-'+section)?.querySelector('summary').focus({preventScroll:true});
    notify(target==='archive'?'Товар добавлен на будущее':'Товар добавлен в покупки');
  }catch(error){$('form-error').textContent=error.message;$('form-error').hidden=false;}
});
render();
if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>document.documentElement.style.setProperty('--header-height',(Math.ceil(document.querySelector('header').getBoundingClientRect().height)+12)+'px')).observe(document.querySelector('header'));

</script></body></html>
