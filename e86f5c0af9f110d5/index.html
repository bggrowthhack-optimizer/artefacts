<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Челны-Оптика — мотивация команды</title><style>/* Общий "движок" калькуляторов мотивации — вёрстка, слайдеры, дельта, подсказки.
   Формулы и конфигурация — за пределами этого файла, в client.js каждого клиента.

   Токены цвета/радиуса/тени скопированы из дизайн-системы Оптимайзера
   (optics_summary/frontend/src/styles/design-tokens.css), чтобы калькулятор
   выглядел как часть того же продукта, а не отдельная поделка:
   OKLCH-палитра, Inter, приглушённые границы, парные статусные цвета
   (заливка *-й и текст *-text — насыщенный жёлтый/зелёный не даёт AA-контраст
   как текст на белом, поэтому у read-only текста своя, более тёмная версия). */

:root {
  --background: oklch(0.975 0.004 264);
  --foreground: oklch(0.18 0.02 264);
  --card: oklch(1 0 0);
  --muted: oklch(0.97 0.006 264);
  --muted-foreground: oklch(0.52 0.015 264);
  --border: oklch(0.90 0.010 264);
  --primary: oklch(0.55 0.22 264);
  --primary-dark: oklch(0.65 0.22 264); /* используется только в тёмной теме, если клиент не задал свой accentDark */
  --primary-foreground: oklch(0.99 0.002 264);

  --excellent: oklch(0.62 0.18 150);
  --excellent-text: oklch(0.54 0.18 150);
  --good: oklch(0.75 0.16 70);
  --good-text: oklch(0.57 0.16 70);
  --poor: oklch(0.58 0.22 25);
  --poor-text: oklch(0.58 0.22 25);
  --info: oklch(0.62 0.16 230);
  --info-text: oklch(0.545 0.16 230);

  --radius-lg: 0.75rem;  /* поля, кнопки, слайдер */
  --radius-xl: 1rem;     /* карточки */
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background: oklch(0.12 0.02 264);
    --foreground: oklch(0.96 0.003 264);
    --card: oklch(0.175 0.018 264);
    --muted: oklch(0.20 0.018 264);
    --muted-foreground: oklch(0.68 0.015 264);
    --border: oklch(0.30 0.016 264);
    --primary: var(--primary-dark);
    --primary-foreground: oklch(0.12 0.02 264);

    --excellent: oklch(0.68 0.18 150);
    --excellent-text: var(--excellent);
    --good: oklch(0.75 0.18 70);
    --good-text: var(--good);
    --poor: oklch(0.62 0.20 25);
    --poor-text: var(--poor);
    --info: oklch(0.68 0.18 230);
    --info-text: var(--info);

    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.40);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.50), 0 2px 4px -2px rgb(0 0 0 / 0.50);
  }
}

:root[data-theme="dark"] {
  --background: oklch(0.12 0.02 264);
  --foreground: oklch(0.96 0.003 264);
  --card: oklch(0.175 0.018 264);
  --muted: oklch(0.20 0.018 264);
  --muted-foreground: oklch(0.68 0.015 264);
  --border: oklch(0.30 0.016 264);
  --primary: var(--primary-dark);
  --primary-foreground: oklch(0.12 0.02 264);

  --excellent: oklch(0.68 0.18 150);
  --excellent-text: var(--excellent);
  --good: oklch(0.75 0.18 70);
  --good-text: var(--good);
  --poor: oklch(0.62 0.20 25);
  --poor-text: var(--poor);
  --info: oklch(0.68 0.18 230);
  --info-text: var(--info);

  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.40);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.50), 0 2px 4px -2px rgb(0 0 0 / 0.50);
}

* { box-sizing: border-box; }

/* Многие компоненты ниже задают свой display (flex/inline-flex) — без этого
   правила [hidden] перестаёт скрывать их, т.к. авторский display побеждает
   display:none из UA-стиля для [hidden] при равной специфичности. */
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--background);
  color: var(--foreground);
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.mono {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  font-variant-numeric: tabular-nums;
}

.app {
  max-width: 920px;
  margin: 0 auto;
  padding: 32px 20px 56px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.hero { display: flex; flex-direction: column; gap: 6px; }

.eyebrow {
  margin: 0;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted-foreground);
}

h1 {
  margin: 0;
  font-size: 1.5rem; /* text-2xl — как заголовок страницы в Оптимайзере */
  font-weight: 600;
  letter-spacing: -0.01em;
  text-wrap: balance;
}

.lede { margin: 0; max-width: 62ch; color: var(--muted-foreground); font-size: 0.875rem; }

/* Шапка «прилипает» к верху окна — при скролле длинного списка полей видно,
   какая роль выбрана и какая сейчас зарплата, не возвращаясь наверх. */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  flex-wrap: wrap;
  align-items: stretch;
  gap: 10px;
  padding: 10px 0;
  background: var(--background);
}
.topbar.stuck {
  box-shadow: 0 6px 16px -12px rgb(0 0 0 / 0.5);
  border-bottom: 1px solid var(--border);
}

.topbar-total {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-end;
  white-space: nowrap;
  padding: 4px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--card);
}
.topbar-total .lbl {
  font-size: 0.625rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted-foreground);
}
.topbar-total .mono { font-size: 1rem; font-weight: 600; }
/* Одна роль — переключателя нет, итог занимает всю ширину шапки. */
.topbar.single-role .topbar-total {
  flex: 1;
  flex-direction: row;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}

.role-switch {
  flex: 1 1 220px;
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  background: var(--muted);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 4px;
  gap: 4px;
}
.role-switch[hidden] { display: none; }

.role-btn {
  appearance: none;
  border: none;
  background: transparent;
  color: var(--muted-foreground);
  font: inherit;
  font-weight: 500;
  font-size: 0.875rem;
  padding: 9px 12px;
  border-radius: calc(var(--radius-lg) - 4px);
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}

.role-btn.active { background: var(--card); color: var(--foreground); box-shadow: var(--shadow-sm); }

.role-btn:focus-visible,
button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

.panel-grid { display: grid; grid-template-columns: 1fr; gap: 18px; }

@media (min-width: 860px) {
  .panel-grid { grid-template-columns: 1fr 1fr; align-items: stretch; }
  .result-card { position: sticky; top: 76px; } /* ниже прилипшей .topbar */
  /* При сгруппированной панели колонка ввода намного выше карточки итога —
     не тянем итог на её высоту (иначе половина карточки — пустота), пусть
     будет своей высоты и «липнет» при скролле. Для простых калькуляторов
     (одна .inputs без групп) оставляем прежнее выравнивание по высоте. */
  .panel-grid.has-groups { align-items: start; }
}

.inputs {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 22px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.2s ease;
}

/* Роль с группами полей: панель — просто контейнер, каждая группа — своя
   карточка. Так длинный список (врач Надин — ~20 полей) распадается на
   «твои рычаги» / «отработка» / «разовые за месяц», и сотруднику видно,
   что двигать. */
.inputs.grouped {
  background: none;
  border: none;
  padding: 0;
  box-shadow: none;
  gap: 14px;
}

.group-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}

.group-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 20px;
}
.group-card:not(.collapsed) .group-head { border-bottom: 1px solid var(--border); }
.group-head[role="button"] { cursor: pointer; user-select: none; }
.group-head[role="button"]:hover { background: var(--muted); }
.group-head[role="button"]:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }

.group-title-block { min-width: 0; }
.group-title { margin: 0; font-size: 0.9375rem; font-weight: 600; }
.group-note { margin: 3px 0 0; font-size: 0.75rem; color: var(--muted-foreground); line-height: 1.45; }

.group-head-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.group-sum {
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--muted-foreground);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.group-toggle {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  border-radius: 6px;
  border: 1px solid var(--border);
  color: var(--muted-foreground);
  font-size: 0.7rem;
  line-height: 20px;
  text-align: center;
}
.group-toggle::before { content: "–"; }
.group-card.collapsed .group-toggle::before { content: "+"; }

.group-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

/* Подпись — всегда отдельной строкой сверху, независимо от длины (как
   Label над Input у Оптимайзера). Строка со слайдером и числом всегда стоит
   на том же месте у всех полей — раньше, когда подпись была рядом со
   значением, длинный текст переносился на две строки и сдвигал поле вниз
   только у этого показателя, вся колонка выглядела неровной. */
.field-label {
  display: block;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--foreground);
  margin-bottom: 10px;
}

.field-control {
  display: flex;
  align-items: center;
  gap: 14px;
}

.field-control input[type="range"] { flex: 1; min-width: 0; }

/* Поле без слайдера (суммы-доплаты) — тянем поле ввода на всю ширину,
   чтобы столбец не выглядел «дырявым» рядом с полями со слайдером. */
.field-control.no-slider .value-input-wrap { flex: 1; }
.field-control.no-slider .value-input { width: 100%; }

/* Подзаголовок-разделитель внутри списка полей (type:'heading') —
   мельче и тише подписи поля, с воздухом сверху. */
.field-group {
  margin: 6px 0 -4px;
  font-size: 0.6875rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted-foreground);
}
.field-group:first-child { margin-top: 0; }

/* Галочка да/нет (type:'checkbox') — подпись сразу справа от квадратика,
   отдельной .field-label тут нет. */
.checkbox-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--foreground);
  cursor: pointer;
}
.field-checkbox {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  accent-color: var(--primary);
  cursor: pointer;
}

/* Выбор из списка (type:'select') — та же геометрия, что у поля ввода числа. */
.field-select {
  width: 100%;
  height: 38px;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--background);
  color: var(--foreground);
  font: inherit;
  font-size: 0.875rem;
  cursor: pointer;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.field-select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--primary) 20%, transparent);
}

/* Значение показателя — не просто текст, а редактируемое поле: сотрудник может
   и тащить слайдер, и вписать точное число (например, из отчёта iTigris/AMO). */
.value-input-wrap { position: relative; flex-shrink: 0; }
.value-input {
  width: 108px;
  height: 34px;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--background);
  color: var(--foreground);
  font: inherit;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 0.875rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  text-align: right;
  -moz-appearance: textfield;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.value-input::-webkit-outer-spin-button,
.value-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.value-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--primary) 20%, transparent);
}
.value-input.has-unit { padding-right: 28px; }
.value-unit {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.8125rem;
  color: var(--muted-foreground);
  pointer-events: none;
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 6px;
  border-radius: 999px;
  background: linear-gradient(to right, var(--primary) var(--fill, 50%), var(--muted) var(--fill, 50%));
  border: 1px solid var(--border);
  cursor: pointer;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--primary);
  border: 3px solid var(--card);
  box-shadow: 0 0 0 1px var(--primary), 0 1px 3px rgba(0,0,0,.2);
  cursor: pointer;
  margin-top: -1px;
}

input[type="range"]::-moz-range-thumb {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: var(--primary);
  border: 3px solid var(--card);
  box-shadow: 0 0 0 1px var(--primary);
  cursor: pointer;
}

input[type="range"]::-moz-range-track { height: 6px; border-radius: 999px; background: transparent; }

/* Подсказка "за счёт чего вырасти" — заметный чип под слайдером, а не серая
   строчка: это главная механика калькулятора, сотрудник должен её видеть. */
.marginal {
  margin: 10px 0 0;
  font-size: 0.75rem;
  color: var(--muted-foreground);
  background: color-mix(in oklab, var(--primary) 8%, var(--card));
  border-radius: var(--radius-lg);
  padding: 8px 10px;
  line-height: 1.5;
}
.marginal .mono { color: var(--primary); font-weight: 600; }

.result-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: var(--shadow-sm);
}

.result-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  font-size: 0.875rem;
  color: var(--muted-foreground);
}

/* Подпись может быть длинной и переноситься на две строки (например,
   "Надбавка KPI 2 (порог 1 (3 000 ₽))") — но само число переноситься не
   должно никогда: разорванное посередине "3 000" / "₽" выглядит как баг,
   а не как перенос текста. */
.result-row > span:first-child { flex: 1 1 auto; min-width: 0; }
.result-row > span:last-child { flex: 0 0 auto; white-space: nowrap; }

.result-row .mono { color: var(--foreground); font-size: 0.9375rem; font-weight: 500; }

.result-total {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.result-total .label {
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--muted-foreground);
}

.result-total .mono { font-size: 1.5rem; font-weight: 600; }

.delta-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  align-self: flex-start;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 600;
}

/* Заливка 10% от статусного цвета + текстовый вариант с AA-контрастом —
   тот же паттерн, что у Badge/text-excellent в Оптимайзере. */
.delta-pill.positive { background: color-mix(in oklab, var(--excellent) 12%, var(--card)); color: var(--excellent-text); }
.delta-pill.negative { background: color-mix(in oklab, var(--poor) 12%, var(--card)); color: var(--poor-text); }
.delta-pill.neutral { background: var(--muted); color: var(--muted-foreground); }

.tip {
  margin: 0;
  font-size: 0.8125rem;
  color: var(--muted-foreground);
  background: color-mix(in oklab, var(--info) 10%, var(--card));
  border-radius: var(--radius-lg);
  padding: 10px 12px;
  line-height: 1.5;
}

.tip strong { color: var(--foreground); }

/* flex-wrap — запасной вариант для очень узких экранов: если обеим кнопкам
   не хватает места даже в одну строку, вторая уходит на новую строку целиком,
   а не переносит текст посередине слова. */
/* margin-top:auto прижимает кнопки (и подпись под ними) к низу карточки —
   когда stretch делает карточку итога выше её собственного контента (чтобы
   сравняться по высоте с карточкой ввода), эта группа занимает освободившееся
   место снизу, а не оставляет пустой разрыв где-то посередине карточки. */
.baseline-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }

.baseline-controls button {
  font: inherit;
  font-weight: 500;
  font-size: 0.8125rem;
  white-space: nowrap;
  height: 38px;
  padding: 0 16px;
  border-radius: var(--radius-lg);
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--foreground);
  transition: box-shadow 0.15s ease, background 0.15s ease, transform 0.1s ease;
}

/* Основная кнопка забирает всё свободное место в строке (текст длиннее),
   вторая — по размеру своего текста. Ни одна не сжимается ниже ширины
   своей надписи (браузер по умолчанию не даёт flex-item сжаться меньше
   min-content, поэтому именно на 0 0 auto надёжнее, чем flex:1 у обеих). */
.baseline-controls button.primary {
  flex: 1 1 auto;
  background: var(--primary);
  color: var(--primary-foreground);
  border-color: var(--primary);
  box-shadow: var(--shadow-sm);
}
.baseline-controls button:not(.primary) { flex: 0 0 auto; }
.baseline-controls button.primary:hover { box-shadow: var(--shadow-md); }
.baseline-controls button:active { transform: scale(0.98); }
.baseline-controls button:disabled { opacity: 0.5; cursor: not-allowed; }

.baseline-note { margin: 0; font-size: 0.75rem; color: var(--muted-foreground); }
.baseline-note .mono { color: var(--foreground); }

footer.formula { font-size: 0.75rem; color: var(--muted-foreground); border-top: 1px solid var(--border); padding-top: 16px; line-height: 1.6; }
footer.formula p { margin: 4px 0; }
footer.formula strong { color: var(--foreground); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

        baselineNote.innerHTML = 'Точка отсчёта ещё не задана — выставь свои реальные цифры и нажми «Зафиксировать».';
      } else {
        btnReset.disabled = false;
        var diff = computed.total - baseline.total;
        var pct = baseline.total > 0 ? Math.round((diff / baseline.total) * 100) : 0;
        deltaPill.hidden = false;
        deltaPill.className = 'delta-pill ' + (diff > 0 ? 'positive' : diff < 0 ? 'negative' : 'neutral');
        if (diff === 0) {
          deltaPill.textContent = 'Без изменений от точки отсчёта';
        } else {
          var sign = diff > 0 ? '+' : '−';
          deltaPill.textContent = sign + fmtMoney(Math.abs(diff)) + ' (' + sign + Math.abs(pct) + '%)';
        }
        baselineNote.innerHTML = 'База: <span class="mono">' + describeSnapshot(role, baseline.snapshot) +
          '</span> → <span class="mono">' + fmtMoney(baseline.total) + '</span>';
      }
    }

    btnSet.addEventListener('click', function () {
      var role = config.roles.filter(function (r) { return r.id === currentRole; })[0];
      var snapshot = Object.assign({}, state[role.id]);
      var computed = role.compute(snapshot);
      baselines[role.id] = { snapshot: snapshot, total: computed.total };
      render();
    });

    btnReset.addEventListener('click', function () {
      var role = config.roles.filter(function (r) { return r.id === currentRole; })[0];
      var baseline = baselines[role.id];
      if (!baseline) return;
      state[role.id] = Object.assign({}, baseline.snapshot);
      render();
    });

    if (config.roles.length < 2) {
      roleSwitch.hidden = true;
      topbar.classList.add('single-role');
    }

    app.appendChild(el('div', { class: 'app' }, [
      hero,
      topbar,
      panelGrid,
      config.footnotes ? el('footer', {
        class: 'formula',
        html: config.footnotes.map(function (t) { return '<p>' + t + '</p>'; }).join('')
      }) : null
    ]));

    // Тень под прилипшей шапкой — только когда она реально «приклеилась» к верху.
    var onScroll = function () {
      topbar.classList.toggle('stuck', topbar.getBoundingClientRect().top <= 0.5);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    render();
    return {
      setState: function (roleId, values) { Object.assign(state[roleId], values); switchRole(roleId); },
      getState: function (roleId) { return Object.assign({}, state[roleId]); },
      switchRole: switchRole
    };
  }

  global.MotivationCalculator = { init: init, util: { fmtMoney: fmtMoney } };
})(window);
